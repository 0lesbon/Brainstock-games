name: Vídeo de notícia automático

on:
  schedule:
    # Acorda de hora em hora (o agendamento do GitHub atrasa e pula horários; o disparo
    # principal vem de uma tarefa agendada externa que chama workflow_dispatch).
    # O job "agenda" decide se é hora de um vídeo: janela, limite por dia e intervalo
    # ficam em config.json -> "schedule".
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Link de uma matéria específica (opcional)"
        required: false
      publicar:
        description: "Enviar/publicar? (desmarque para só gerar o vídeo)"
        type: boolean
        default: true
      modo:
        description: "noticia (print + fotos) ou video (vídeo da NASA narrado)"
        required: false
        default: "noticia"
      forcar:
        description: "Gerar agora, ignorando o limite diário e o horário"
        type: boolean
        default: false

permissions:
  contents: write # criar releases (hospedar o vídeo) e salvar o histórico

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # sempre a versão mais nova da branch (com o histórico atualizado por execuções anteriores),
          # e não o commit do momento do disparo
          ref: ${{ github.ref_name }}
      - id: decide
        name: É hora de um vídeo?
        run: |
          if [ "${{ inputs.forcar }}" = "true" ] || [ "${{ inputs.publicar }}" = "false" ] || [ -n "${{ inputs.url }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "[agenda] disparo manual forçado"
          else
            node src/should-run.js
          fi

  gerar:
    needs: agenda
    if: needs.agenda.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # As chaves estão guardadas neste ambiente (Settings > Environments)
    environment: ELEVENLABS_API_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          # sempre a versão mais nova da branch (com o histórico atualizado por execuções anteriores),
          # e não o commit do momento do disparo
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências do sistema (ffmpeg e fontes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core

      - name: Dependências do projeto
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Gerar e publicar
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_PUBLICAR: ${{ inputs.publicar }}
          INPUT_MODO: ${{ inputs.modo }}
        run: |
          ARGS=()
          if [ -n "$INPUT_URL" ]; then ARGS+=(--url "$INPUT_URL"); fi
          if [ "$INPUT_PUBLICAR" = "false" ]; then ARGS+=(--no-publish); fi
          if [ "$INPUT_MODO" = "video" ]; then ARGS+=(--modo video); fi
          node src/run.js "${ARGS[@]}"

      - name: Guardar o vídeo como artefato do workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Salvar histórico (evita repetir notícia)
        run: |
          if ! git diff --quiet state/history.json; then
            git config user.name "noticias-bot"
            git config user.email "noticias-bot@users.noreply.github.com"
            git add state/history.json
            git commit -m "Histórico: nova notícia publicada"
            git pull --rebase -q origin "$GITHUB_REF_NAME" || true
            git push
          fi
